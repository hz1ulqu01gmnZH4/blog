<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

  // Wait for DOM to be ready
  document.addEventListener('DOMContentLoaded', async function() {
    // Initialize with dark theme and larger size
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      themeVariables: {
        darkMode: true,
        background: '#0d1117',
        primaryColor: '#58a6ff',
        primaryTextColor: '#c9d1d9',
        primaryBorderColor: '#30363d',
        lineColor: '#8b949e',
        secondaryColor: '#21262d',
        tertiaryColor: '#161b22',
        fontSize: '16px'
      },
      flowchart: {
        useMaxWidth: true,
        htmlLabels: true,
        curve: 'basis'
      },
      gantt: {
        useMaxWidth: true,
        leftPadding: 150,
        gridLineStartPadding: 10,
        fontSize: 14,
        numberSectionStyles: 5,
        sectionFontSize: 14,
        taskFontSize: 12
      }
    });

    // Find all mermaid code blocks and render them
    const mermaidBlocks = document.querySelectorAll('pre code.language-mermaid');
    console.log('Found', mermaidBlocks.length, 'mermaid diagrams');

    for (let i = 0; i < mermaidBlocks.length; i++) {
      const block = mermaidBlocks[i];

      try {
        // Get text content and decode HTML entities (Jekyll escapes <br/>, -->, etc.)
        const textarea = document.createElement('textarea');
        textarea.innerHTML = block.innerHTML;
        const graphDefinition = textarea.value;

        console.log(`Rendering diagram ${i}:`, graphDefinition.substring(0, 100));

        // Generate unique ID
        const id = `mermaid-diagram-${i}`;

        // Render the diagram
        const { svg } = await mermaid.render(id, graphDefinition);

        // Create container div
        const div = document.createElement('div');
        div.classList.add('mermaid');
        div.innerHTML = svg;

        // Replace the code block with the rendered SVG
        block.parentElement.replaceWith(div);

        console.log(`Successfully rendered diagram ${i}`);
      } catch (err) {
        console.error(`Error rendering diagram ${i}:`, err);

        // Remove any error elements that mermaid.render() may have created
        const errorElement = document.getElementById(`mermaid-diagram-${i}`);
        if (errorElement && errorElement.parentElement) {
          errorElement.remove();
        }

        // Leave the original code block in place so the error is visible in context
      }
    }
  });
</script>
