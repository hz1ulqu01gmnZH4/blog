<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

  // Wait for DOM to be ready
  document.addEventListener('DOMContentLoaded', function() {
    // Initialize with dark theme and larger size
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      themeVariables: {
        darkMode: true,
        background: '#0d1117',
        primaryColor: '#58a6ff',
        primaryTextColor: '#c9d1d9',
        primaryBorderColor: '#30363d',
        lineColor: '#8b949e',
        secondaryColor: '#21262d',
        tertiaryColor: '#161b22',
        fontSize: '16px'
      },
      flowchart: {
        useMaxWidth: true,
        htmlLabels: true,
        curve: 'basis'
      },
      gantt: {
        useMaxWidth: true,
        leftPadding: 75,
        gridLineStartPadding: 10,
        fontSize: 14,
        numberSectionStyles: 5
      }
    });

    // Find all mermaid code blocks and render them
    const mermaidBlocks = document.querySelectorAll('pre code.language-mermaid');
    mermaidBlocks.forEach((block, index) => {
      // Create a div to hold the rendered diagram
      const div = document.createElement('div');
      div.classList.add('mermaid');
      div.textContent = block.textContent;
      div.id = `mermaid-diagram-${index}`;

      // Replace the code block with the div
      block.parentElement.replaceWith(div);
    });

    // Run mermaid on all diagram divs
    mermaid.run({
      querySelector: '.mermaid'
    });
  });
</script>
