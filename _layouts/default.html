<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
    {% if page.mermaid %}
      {% include mermaid.html %}
    {% endif %}
  </head>
  <body>
    <div class="container">
      <header class="site-header">
        <h1><a href="{{ "/" | relative_url }}"><span class="prompt">$</span> cat {{ site.title }}</a></h1>
        {% if site.description %}
        <p class="site-description">{{ site.description }}</p>
        {% endif %}
        <nav class="site-nav"><a href="{{ "/archive/" | relative_url }}">archive</a></nav>
      </header>
      <main class="site-content">
        {{ content }}
      </main>
      <footer class="site-footer">
        <p>&copy; {{ site.time | date: "%Y" }} {{ site.title }}</p>
        <p><a href="{{ "/feed.xml" | relative_url }}">RSS</a></p>
      </footer>
    </div>

    <!-- Image lightbox modal -->
    <div id="image-modal" class="image-modal" onclick="closeModal(event)">
      <span class="modal-close">&times;</span>
      <img class="modal-content" id="modal-img" alt="">
      <div class="modal-caption" id="modal-caption"></div>
    </div>

    <script>
      // Make post images clickable for lightbox
      document.addEventListener('DOMContentLoaded', function() {
        const postBody = document.querySelector('.post-body');
        if (postBody) {
          const images = postBody.querySelectorAll('img');
          images.forEach(function(img) {
            img.style.cursor = 'pointer';
            img.onclick = function() {
              const modal = document.getElementById('image-modal');
              const modalImg = document.getElementById('modal-img');
              const caption = document.getElementById('modal-caption');

              modal.style.display = 'flex';
              modalImg.src = this.src;
              modalImg.alt = this.alt;

              // Get caption from following em element if it exists
              const nextElem = this.nextElementSibling;
              if (nextElem && nextElem.tagName === 'EM') {
                caption.innerHTML = nextElem.innerHTML;
              } else {
                caption.innerHTML = this.alt;
              }

              document.body.style.overflow = 'hidden';
            };
          });
        }
      });

      function closeModal(event) {
        const modal = document.getElementById('image-modal');
        const modalImg = document.getElementById('modal-img');

        // Close if clicked outside the image or on close button
        if (event.target === modal || event.target.className === 'modal-close') {
          modal.style.display = 'none';
          document.body.style.overflow = 'auto';
        }
      }

      // Close modal on Escape key
      document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
          const modal = document.getElementById('image-modal');
          if (modal.style.display === 'flex') {
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
          }
        }
      });
    </script>

    <!-- KaTeX auto-render -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05" crossorigin="anonymous"
        onload="renderMathInElement(document.body, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '\\[', right: '\\]', display: true},
            {left: '\\(', right: '\\)', display: false}
          ]
        });"></script>
  </body>
</html>
